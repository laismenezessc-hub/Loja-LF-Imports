<style>
:root{
  color-scheme:light;
  --pearl:#EFE9E1; --silk:#CFC3B4; --gold:#B8912F; --gold-lt:#E7CE93; --ink:#1E1913; --ink-2:#4A4137;
  --bg:var(--pearl); --text:var(--ink); --muted:var(--ink-2);
  --halo:rgba(231,190,96,.62); --halo-soft:rgba(231,206,147,.28);
  --p-bg:var(--ink); --p-fg:var(--gold-lt); --p-sub:rgba(231,206,147,.8); --p-shadow:rgba(30,25,19,.28);
  --s-border:var(--gold); --s-fg:var(--ink); --s-hover:rgba(184,145,47,.12);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100svh; display:grid; place-items:center;
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-weight:300; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:max(32px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));
}
main{width:min(420px,100%); text-align:center}

/* o logo é um letreiro iluminado por trás: o halo é o ponto alto da página */
.sign{position:relative; width:148px; height:148px; margin:0 auto 26px}
.halo{
  position:absolute; inset:-64px; border-radius:50%; pointer-events:none;
  background:radial-gradient(closest-side,var(--halo) 0%,var(--halo-soft) 55%,transparent 100%);
}
.sign img{
  position:relative; display:block; width:100%; height:100%; border-radius:50%; object-fit:cover;
  box-shadow:0 0 0 1px rgba(184,145,47,.5), 0 0 0 7px var(--bg), 0 0 0 8px rgba(184,145,47,.45), 0 16px 38px rgba(58,49,40,.3);
}
@media (prefers-reduced-motion:no-preference){
  .halo{animation:light 1.4s cubic-bezier(.2,.7,.2,1) both}
  @keyframes light{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
}

h1{
  margin:0 0 6px; padding-left:.24em;
  font:500 1.6rem/1.1 var(--serif); letter-spacing:.24em;
}
.sub{margin:0; font-size:.74rem; letter-spacing:.22em; color:var(--muted)}
.orn{display:flex; align-items:center; gap:12px; width:190px; margin:22px auto 20px}
.orn::before,.orn::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.orn i{width:6px; height:6px; background:var(--gold); transform:rotate(45deg)}
.tag{margin:0 0 30px; font:italic 400 1.45rem/1.25 var(--serif)}

.links{display:grid; gap:14px}
.btn{
  display:flex; align-items:center; gap:15px; min-height:72px; padding:14px 18px;
  border-radius:2px; text-align:left; text-decoration:none; -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
}
.btn:active{transform:scale(.985)}
.ico{
  flex:none; width:40px; height:40px; display:grid; place-items:center; border-radius:50%;
  border:1px solid currentColor;
}
.ico svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
.txt{display:grid; gap:1px; min-width:0}
.txt b{font-weight:500; font-size:1.05rem}
.txt small{font-size:.8rem; font-weight:300}
.primary{background:var(--p-bg); color:var(--p-fg); box-shadow:0 10px 26px var(--p-shadow)}
.primary small{color:var(--p-sub)}
.primary:hover{transform:translateY(-1px); box-shadow:0 14px 32px var(--p-shadow)}
.secondary{border:1px solid var(--s-border); color:var(--s-fg)}
.secondary small{color:var(--muted)}
.secondary:hover{background:var(--s-hover)}
.btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px}

footer{margin-top:34px; font-size:.78rem; letter-spacing:.14em; color:var(--muted)}
</style>
</head>
